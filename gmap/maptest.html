<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Maps Sample</title>
<style>
html { height: 100% }
body { height: 100% }
#map { height: 100%; width: 100%}
</style>
</head>

<body>
<input type="checkbox" id="convenience_store" class="map_categories" />コンビニ
<input type="checkbox" id="supermarket" class="map_categories" />スーパー
<input type="checkbox" id="bank" class="map_categories" />銀行・郵便局
<div id="map"></div>

<script>
(g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({
  key: "AIzaSyAAaGm6w2tC6VHTZKMCSfT9gt3Jq1zKy2c",
  v: "quarterly",
  language: "ja",
});

let __map;
let __placesService;
let __makers = {};
const TYPE_DEFS = {
  'convenience_store': ['convenience_store'],
  'supermarket': ['supermarket'],
  'bank': ['bank','post_office'],
};
const ICON_DEFS = {
  'convenience_store': 'https://s.shamaison.com/common/img/recommended_equipment_ico_019.svg',
  'supermarket': 'https://s.shamaison.com/common/img/recommended_equipment_ico_021.svg',
  'bank': 'https://s.shamaison.com/common/img/recommended_equipment_ico_047.svg',
};

async function initMap() {
  const { Map } = await google.maps.importLibrary("maps");
  const { Places } = await google.maps.importLibrary("places");
  const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

  let myLatLng = new google.maps.LatLng(35.6811673, 139.7670516);
  __map = new Map(document.getElementById("map"), {
    center: myLatLng,
    zoom: 15,
    mapId: "a0c0c8b0f54a31f6",
    zoomControl: true,
    mapTypeControl: false,
    scaleControl: false,
    streetViewControl: false,
    rotateControl: false,
    fullscreenControl: false,
  });

  __placesService = new google.maps.places.PlacesService(__map);

  let targets = document.getElementsByClassName('map_categories');
  if (targets) {
    for(let i = 0; i < targets.length; i++) {
      targets[i].addEventListener('change', function() {
        checkCategory(this);
      });
    }
  }
}
initMap();

function checkCategory(element) {
  console.log(element.checked);

  if (element.checked) {

    let makers = __makers[element.id];
    if (makers) {
console.log('@1');
      for(let i = 0; i < makers.length; i++) {
        makers[i].map = __map;
      }
      return;
    }

console.log('@2');
    let types = TYPE_DEFS[element.id];
    if (!types) return;
    let iconUrl = ICON_DEFS[element.id];
console.log(iconUrl);
    if (!iconUrl) return;
    makers = searchPlaces(__map.getCenter(), types, iconUrl);
    __makers[element.id] = makers;
  } else {
    let makers = __makers[element.id];
    if (makers) {
console.log('@3');
      for(let i = 0; i < makers.length; i++) {
        makers[i].map = null;
      }
    }
  }
}

function searchPlaces(location, types, iconUrl) {
  if (!__map) return; if (!__placesService) return;

  makers = [];

  const request = {
    location: location,
    radius: 300,
    types: types
  };
  __placesService.nearbySearch(request, function (results, status, pagination) {
    if (status !== google.maps.places.PlacesServiceStatus.OK || !results) return;

    for (let i = 0; i < results.length; i++) {
      let place = results[i];
      let marker = createMarker(place.geometry.location, place.name, iconUrl);
      if (marker) {
        makers.push(marker);
      }
    }

    if (pagination && pagination.hasNextPage) {
// ※※ページネーション　アクセス数上がるのでコメント
//        pagination.nextPage();
    }
  });

  return makers;
}

function createMarker(position, title, iconUrl) {
  if (!__map) return null;

　const flagImg = document.createElement("img");
  flagImg.src = iconUrl;
  return new google.maps.marker.AdvancedMarkerElement({
    map: __map,
    position: position,
    title: title,
    content: flagImg,
  });
}
</script>

</body>
</html>
